name: Online Integration

on:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 1'

jobs:
  online:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/bilibili_provider
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          # Same pin as unit.yml, so local runs and both workflows agree.
          sdk: 3.11.4
      - run: dart pub get
      - run: dart test --tags online --run-skipped
