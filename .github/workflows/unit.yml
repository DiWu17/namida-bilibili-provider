name: Unit Tests

on:
  push:
  pull_request:

jobs:
  offline:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - packages/online_media_provider
          - packages/bilibili_provider
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          # Pinned on purpose, not `stable`.
          #
          # `dart format --output=none --set-exit-if-changed .` is only
          # reproducible when the formatter version is fixed: dart_style changes
          # its layout decisions between Dart releases, so a new stable SDK can
          # start reformatting files that are already committed and fail this job
          # with no code change (that is exactly what happened with Dart 3.11.x
          # vs a newer stable, on test/online/bilibili_account_online_test.dart).
          #
          # Keep this equal to the Dart SDK bundled with the Flutter version the
          # packages are developed against. When bumping it, also run
          # `dart format .` in both packages and commit the result.
          sdk: 3.11.4
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze
      - run: dart test
