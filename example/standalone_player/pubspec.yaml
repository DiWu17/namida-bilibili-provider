name: standalone_player
description: Standalone Flutter proof-of-concept player for the Bilibili provider.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  bilibili_provider:
    path: ../../packages/bilibili_provider
  online_media_provider:
    path: ../../packages/online_media_provider
  media_kit: ^1.2.6
  media_kit_video: ^1.3.1
  media_kit_libs_video: ^1.0.7
  # Pure-Dart QR renderer for the Bilibili scan-to-login flow (no platform code).
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
